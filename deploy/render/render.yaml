# Backend compute candidate; keep the current external PostgreSQL primary.
# Select this nested path explicitly when creating the approved free service.
services:
  - type: web
    name: learning-hub-api-candidate
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: DATABASE_STARTUP_MODE
        value: verify
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
